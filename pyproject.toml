[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptsmith"
version = "0.1.0"
description = "Crypto attack primitives and analysis toolkit for CTF players and security researchers. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jake Burre" }]
keywords = ["crypto", "ctf", "cryptanalysis", "rsa", "pcap", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/burrejak22/cryptsmith"
Repository = "https://github.com/burrejak22/cryptsmith"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
